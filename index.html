<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"></head><body><title>Boosie Network Command Centre</title>
<style>
:root{
  /* Palette lifted from Boosie_Network_Launch_Proposal_2.pptx: gold #D4AF37,
     crimson #A6192E, cream #F5F1E8, ink #0A0A0A. Neutrals are biased warm
     toward the gold rather than left as a default mid-grey. */
  --ink:#0B0A08; --ink-2:#16130E; --ink-3:#231E16;
  --gold:#D4AF37; --gold-hi:#F0D678; --gold-lo:#8A6D1F;
  --crimson:#A6192E; --crimson-hi:#D4405A;
  --cream:#F5F1E8; --paper:#FBF9F4;

  --bg:var(--paper); --surface:#FFFFFF; --surface-2:var(--cream);
  --fg:#1A1712; --fg-2:#4A4238; --muted:#7C7264;
  --rule:#E2DACA; --accent:var(--gold-lo); --accent-bright:#B08D28;
  --alert:var(--crimson);
  --shadow:0 1px 2px rgba(26,23,18,.06), 0 8px 24px rgba(26,23,18,.06);

  --display:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --data:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --quote:Georgia,"Iowan Old Style","Times New Roman",serif;

  --rail:16.5rem; --measure:74ch;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:var(--ink); --surface:var(--ink-2); --surface-2:var(--ink-3);
    --fg:#F2ECE0; --fg-2:#C8BEAC; --muted:#8C8375;
    --rule:#2E271D; --accent:var(--gold); --accent-bright:var(--gold-hi);
    --alert:var(--crimson-hi);
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:var(--ink); --surface:var(--ink-2); --surface-2:var(--ink-3);
  --fg:#F2ECE0; --fg-2:#C8BEAC; --muted:#8C8375;
  --rule:#2E271D; --accent:var(--gold); --accent-bright:var(--gold-hi);
  --alert:var(--crimson-hi);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);
  font-size:16px;line-height:1.62;-webkit-font-smoothing:antialiased}
a{color:var(--accent-bright);text-underline-offset:.18em}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}

/* ---------- gate ---------- */
#gate{min-height:100vh;display:grid;place-items:center;padding:2rem;
  background:radial-gradient(120% 90% at 50% 0%, color-mix(in srgb,var(--accent) 12%,transparent), transparent 60%),var(--bg)}
.gate-card{width:min(30rem,100%);text-align:center;display:flex;flex-direction:column;gap:1.1rem}
.gate-mark{font-family:var(--display);font-weight:800;letter-spacing:-.02em;
  font-size:clamp(2.2rem,7vw,3.2rem);line-height:.95;text-transform:uppercase;color:var(--accent)}
.gate-mark span{display:block;font-size:.34em;letter-spacing:.42em;color:var(--fg-2);
  margin-top:.7rem;font-weight:600}
.gate-sub{color:var(--muted);font-family:var(--data);font-size:.78rem;
  letter-spacing:.14em;text-transform:uppercase}
.gate-form{display:flex;gap:.5rem;margin-top:.4rem}
.gate-form input{flex:1;min-width:0;padding:.85rem 1rem;border-radius:3px;
  border:1px solid var(--rule);background:var(--surface);color:var(--fg);
  font-family:var(--data);font-size:.95rem;letter-spacing:.04em}
.gate-form button{padding:.85rem 1.4rem;border:0;border-radius:3px;cursor:pointer;
  background:var(--accent);color:var(--bg);font-family:var(--display);font-weight:800;
  text-transform:uppercase;letter-spacing:.1em;font-size:.8rem}
.gate-form button:hover{background:var(--accent-bright)}
#gate-err{color:var(--alert);font-family:var(--data);font-size:.8rem;min-height:1.2em}
.gate-note{color:var(--muted);font-size:.76rem;line-height:1.5;border-top:1px solid var(--rule);
  padding-top:1rem;margin-top:.4rem}

/* ---------- shell ---------- */
#shell{display:none}
#shell.on{display:block}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--rule)}
.bar-in{max-width:96rem;margin:0 auto;padding:.7rem 1.4rem;display:flex;align-items:center;gap:1.2rem}
.brand{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:-.01em;
  font-size:1.02rem;color:var(--accent);white-space:nowrap}
.brand em{font-style:normal;color:var(--fg-2);font-weight:600;letter-spacing:.2em;font-size:.66em}
.count{margin-left:auto;display:flex;align-items:baseline;gap:.5rem;font-family:var(--data);
  font-variant-numeric:tabular-nums;min-width:0}
.cd-fine{display:contents}
.count b{font-family:var(--display);font-size:1.5rem;font-weight:800;color:var(--accent);
  letter-spacing:-.02em;line-height:1}
.count small{color:var(--muted);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase}
.themetog{border:1px solid var(--rule);background:transparent;color:var(--fg-2);cursor:pointer;
  border-radius:3px;padding:.4rem .6rem;font-size:.9rem;line-height:1;flex:none}
@media(max-width:44rem){
  .bar-in{gap:.7rem;padding:.6rem 1rem}
  .brand em{display:none}
  .cd-fine,.cd-label{display:none}
  .count b{font-size:1.25rem}
}

.wrap{max-width:96rem;margin:0 auto;padding:0 1.4rem;display:grid;
  grid-template-columns:var(--rail) minmax(0,1fr);gap:2.6rem;align-items:start}
/* minmax(0,…) on both tracks, and min-width:0 on the children: a bare 1fr
   resolves its floor to min-content, so one wide table drags the whole grid
   past the viewport and the body scrolls sideways. */
.wrap>*{min-width:0}
@media(max-width:60rem){.wrap{grid-template-columns:minmax(0,1fr);gap:0;padding:0 1rem}}

/* ---------- rail (a transmission log, not a generic sidebar) ---------- */
.rail{position:sticky;top:4.1rem;padding:1.8rem 0 3rem;max-height:calc(100vh - 4.1rem);overflow:auto}
.rail-h{font-family:var(--data);font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted);padding:0 0 .8rem}
.tabs{display:flex;flex-direction:column;gap:.1rem}
.tab{display:grid;grid-template-columns:1.9rem 1fr;align-items:baseline;gap:.1rem .6rem;
  text-align:left;width:100%;border:0;background:none;cursor:pointer;color:var(--fg-2);
  padding:.62rem .7rem;border-radius:3px;border-left:2px solid transparent;font-family:var(--body)}
.tab:hover{background:var(--surface-2);color:var(--fg)}
.tab .n{font-family:var(--data);font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tab .t{font-weight:650;font-size:.95rem;letter-spacing:-.005em}
.tab .c{grid-column:2;font-size:.74rem;color:var(--muted);line-height:1.35}
.tab[aria-selected="true"]{background:var(--surface-2);color:var(--fg);border-left-color:var(--accent)}
.tab[aria-selected="true"] .n{color:var(--accent)}
@media(max-width:60rem){
  .rail{position:sticky;top:3.6rem;padding:.5rem 0;max-height:none;
    background:var(--bg);border-bottom:1px solid var(--rule);z-index:15}
  .rail-h{display:none}
  .tabs{flex-direction:row;overflow-x:auto;gap:.3rem;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{grid-template-columns:auto;white-space:nowrap;border-left:0;border-bottom:2px solid transparent;
    padding:.5rem .8rem;border-radius:0}
  .tab .n,.tab .c{display:none}
  .tab[aria-selected="true"]{border-bottom-color:var(--accent);background:none}
}

/* ---------- content ---------- */
.pane{display:none;padding:2.4rem 0 6rem;max-width:var(--measure);animation:rise .32s ease both}
.pane.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.pane{animation:none}}

.pane h1{font-family:var(--display);font-weight:800;text-transform:uppercase;
  font-size:clamp(1.9rem,4.4vw,2.7rem);line-height:1.02;letter-spacing:-.025em;
  margin:0 0 1.4rem;text-wrap:balance;color:var(--fg)}
.pane h2{font-family:var(--display);font-weight:800;font-size:1.42rem;line-height:1.15;
  letter-spacing:-.015em;margin:3rem 0 .9rem;padding-top:1.3rem;border-top:1px solid var(--rule);
  text-wrap:balance}
.pane h3{font-size:1.08rem;font-weight:750;margin:2rem 0 .6rem;letter-spacing:-.005em;text-wrap:balance}
.pane h4{font-size:.94rem;font-weight:700;margin:1.5rem 0 .4rem;color:var(--fg-2)}
.pane p{margin:0 0 1.05rem}
.pane ul,.pane ol{margin:0 0 1.05rem;padding-left:1.3rem}
.pane li{margin:.3rem 0}
.pane li::marker{color:var(--accent)}
.pane hr{border:0;border-top:1px solid var(--rule);margin:2.6rem 0}
.pane strong{font-weight:700;color:var(--fg)}
.pane em{color:var(--fg-2)}

.pane blockquote{margin:1.5rem 0;padding:.2rem 0 .2rem 1.2rem;border-left:2px solid var(--alert);
  color:var(--fg-2);font-family:var(--quote);font-size:1.04rem;line-height:1.55}
.pane blockquote p{margin:0 0 .6rem}
.pane blockquote p:last-child{margin:0}

.pane code{font-family:var(--data);font-size:.86em;background:var(--surface-2);
  padding:.12em .38em;border-radius:3px;color:var(--fg)}
.pane pre{background:var(--surface-2);border:1px solid var(--rule);border-radius:4px;
  padding:1rem 1.1rem;overflow-x:auto;margin:0 0 1.2rem}
.pane pre code{background:none;padding:0;font-size:.82rem;line-height:1.55}

.tw{overflow-x:auto;margin:0 0 1.4rem;border:1px solid var(--rule);border-radius:4px;
  background:var(--surface)}
.pane table{border-collapse:collapse;width:100%;font-size:.86rem;
  font-variant-numeric:tabular-nums}
.pane th{font-family:var(--data);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);text-align:left;padding:.7rem .85rem;border-bottom:1px solid var(--rule);
  white-space:nowrap;font-weight:600;background:var(--surface-2)}
.pane td{padding:.62rem .85rem;border-bottom:1px solid var(--rule);vertical-align:top;
  line-height:1.45}
.pane tbody tr:last-child td{border-bottom:0}
.pane tbody tr:hover{background:var(--surface-2)}
.pane td code{white-space:nowrap}

.foot{border-top:1px solid var(--rule);margin-top:3rem;padding:1.4rem 0 3rem;
  font-family:var(--data);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);display:flex;flex-wrap:wrap;gap:.5rem 1.4rem}
</style>

<div id="gate">
  <div class="gate-card">
    <div class="gate-mark">Boosie Network<span>Command Centre</span></div>
    <div class="gate-sub">Confidential &middot; Password required</div>
    <form class="gate-form" id="gate-form" autocomplete="off">
      <input id="gate-pw" type="password" placeholder="Password" aria-label="Password"
             autocomplete="current-password" required>
      <button type="submit">Open</button>

</div>

<div id="shell">

  </div>
</div>

<script>
(function(){
  var P = window.__PAYLOAD__;
  var gate = document.getElementById('gate'),
      shell = document.getElementById('shell'),
      form  = document.getElementById('gate-form'),
      input = document.getElementById('gate-pw'),
      err   = document.getElementById('gate-err');

  function b64(s){var r=atob(s),a=new Uint8Array(r.length);
    for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}

  async function unlock(pw){
    var enc=new TextEncoder();
    var base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},
      base,{name:'AES-GCM',length:256},false,['decrypt']);
    var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));
    return new TextDecoder().decode(plain);
  }

  form.addEventListener('submit',async function(e){
    e.preventDefault();
    err.textContent='';
    var btn=form.querySelector('button'), was=btn.textContent;
    btn.textContent='Opening…'; btn.disabled=true;
    try{
      var html=await unlock(input.value);
      document.getElementById('panes').innerHTML=html;
      gate.style.display='none';
      shell.classList.add('on');
      initTabs();
      try{sessionStorage.setItem('bn_pw',input.value);}catch(_){}
    }catch(_){
      // AES-GCM auth failure is indistinguishable from any other decrypt error,
      // and in practice a failure here is always the wrong password.
      err.textContent='Incorrect password.';
      input.select();
    }finally{ btn.textContent=was; btn.disabled=false; }
  });

  var wired=false;
  function initTabs(){
    var tabs=[].slice.call(document.querySelectorAll('.tab')),
        panes=[].slice.call(document.querySelectorAll('.pane'));
    function show(i,push){
      tabs.forEach(function(t,j){t.setAttribute('aria-selected',j===i?'true':'false');});
      panes.forEach(function(p,j){p.classList.toggle('on',j===i);});
      if(push){history.replaceState(null,'','#'+tabs[i].dataset.slug);}
      // Both are needed: scrollTo alone does not reliably reset in every engine
      // once a sticky header is in play, and a stale offset hides the h1.
      window.scrollTo(0,0);
      document.documentElement.scrollTop=0; document.body.scrollTop=0;
    }
    // Unlock can run twice (a saved session auto-submits), and binding a second
    // set of handlers over a replaced #panes leaves detached nodes being toggled.
    if(wired){ show(0,false); return; }
    wired=true;
    tabs.forEach(function(t,i){
      t.addEventListener('click',function(){show(i,true);});
      t.addEventListener('keydown',function(e){
        var d=e.key==='ArrowDown'||e.key==='ArrowRight'?1:
              e.key==='ArrowUp'||e.key==='ArrowLeft'?-1:0;
        if(!d)return; e.preventDefault();
        var n=(i+d+tabs.length)%tabs.length; tabs[n].focus(); show(n,true);
      });
    });
    var want=location.hash.replace('#','');
    var idx=tabs.findIndex(function(t){return t.dataset.slug===want;});
    show(idx>=0?idx:0,false);
    tick(); setInterval(tick,1000);
  }

  function tick(){
    var el=document.getElementById('cd'); if(!el)return;
    var ms=Date.parse(P.launch)-Date.now();
    var d=Math.floor(ms/864e5), h=Math.floor(ms/36e5)%24,
        m=Math.floor(ms/6e4)%60, s=Math.floor(ms/1e3)%60;
    if(ms<=0){ el.innerHTML='<b>LIVE</b><small>Now streaming</small>'; return; }
    // .cd-fine and .cd-label collapse on narrow screens so the header row can
    // never out-width the viewport and push the whole document sideways.
    el.innerHTML='<b>'+d+'</b><small>d</small>'+
                 '<span class="cd-fine"><b>'+String(h).padStart(2,'0')+'</b><small>h</small>'+
                 '<b>'+String(m).padStart(2,'0')+'</b><small>m</small>'+
                 '<b>'+String(s).padStart(2,'0')+'</b><small>s</small></span>'+
                 '<small class="cd-label">to premiere</small>';
  }

  var tt=document.getElementById('themetog');
  if(tt) tt.addEventListener('click',function(){
    var cur=document.documentElement.getAttribute('data-theme');
    var next=cur==='dark'?'light':cur==='light'?'dark':
      (matchMedia('(prefers-color-scheme: dark)').matches?'light':'dark');
    document.documentElement.setAttribute('data-theme',next);
  });

  // Survive a reload within the session without re-typing.
  try{
    var saved=sessionStorage.getItem('bn_pw');
    if(saved){ input.value=saved; form.requestSubmit(); }
  }catch(_){}
})();
</script></body></html>
